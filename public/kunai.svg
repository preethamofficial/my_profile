<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Realistic cyber ninja kunai with glowing energy edges">
  <defs>
    <linearGradient id="bladeBody" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#3a4656"/>
      <stop offset="0.18" stop-color="#161c26"/>
      <stop offset="0.42" stop-color="#050608"/>
      <stop offset="0.6" stop-color="#10151d"/>
      <stop offset="0.8" stop-color="#04050a"/>
      <stop offset="1" stop-color="#1c2530"/>
    </linearGradient>
    <linearGradient id="bladeFaceR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.7" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#131a24"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="energyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="metalHilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.3" stop-color="#222c3a"/>
      <stop offset="0.5" stop-color="#39485c"/>
      <stop offset="0.7" stop-color="#1a2330"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="200" rx="165" ry="195" fill="url(#aura)"/>

  <g transform="rotate(38 200 200)">
    <path d="M200 14 L236 182 L200 254 L164 182 Z" fill="none" stroke="url(#energy)" stroke-width="6" opacity="0.35" filter="url(#glowSoft)"/>
    <path d="M200 14 L236 182 L200 254 Z" fill="url(#bladeFaceR)"/>
    <path d="M200 14 L164 182 L200 254 Z" fill="url(#bladeBody)"/>
    <path d="M200 14 L200 254" stroke="#4b5c72" stroke-width="1.4" opacity="0.9"/>
    <path d="M200 14 L200 120" stroke="#9fb4cc" stroke-width="0.8" opacity="0.85"/>
    <path d="M200 14 L236 182 L200 254" fill="none" stroke="url(#energy)" stroke-width="2.4" filter="url(#glow)"/>
    <path d="M200 14 L164 182 L200 254" fill="none" stroke="url(#energyV)" stroke-width="2.4" filter="url(#glow)"/>
    <path d="M197 30 L197 240" stroke="url(#energy)" stroke-width="1.2" opacity="0.75" filter="url(#glow)"/>
    <path d="M206 60 L216 150 L212 152 L203 62 Z" fill="#c7d8ee" opacity="0.55"/>
    <path d="M204 96 L209 140" stroke="#e6f2ff" stroke-width="1.4" opacity="0.8"/>
    <path d="M191 110 L188 170" stroke="#818cf8" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
    <path d="M172 232 L228 232 L226 248 L174 248 Z" fill="#000000" opacity="0.55"/>

    <path d="M166 252 L234 252 L242 272 L158 272 Z" fill="url(#metalHilt)" stroke="url(#energy)" stroke-width="1.8" filter="url(#glow)"/>
    <path d="M166 252 L242 272" stroke="#6d7f96" stroke-width="0.8" opacity="0.7"/>
    <g fill="#0a0e14" stroke="#22d3ee" stroke-width="0.7" opacity="0.9">
      <circle cx="176" cy="262" r="2.4"/>
      <circle cx="200" cy="262" r="2.8" fill="#22d3ee" filter="url(#glow)"/>
      <circle cx="224" cy="262" r="2.4"/>
    </g>

    <rect x="185" y="272" width="30" height="88" rx="6" fill="url(#metalHilt)" stroke="rgba(99,102,241,0.7)" stroke-width="1.6"/>
    <g stroke="#05070b" stroke-width="2" opacity="0.9">
      <path d="M185 288 L215 288"/>
      <path d="M185 306 L215 306"/>
      <path d="M185 324 L215 324"/>
      <path d="M185 342 L215 342"/>
    </g>
    <path d="M185 276 L185 356" stroke="#22d3ee" stroke-width="1" opacity="0.5" filter="url(#glow)"/>
    <path d="M215 276 L215 356" stroke="#a855f7" stroke-width="1" opacity="0.5" filter="url(#glow)"/>

    <circle cx="200" cy="376" r="17" fill="none" stroke="url(#metalHilt)" stroke-width="7"/>
    <circle cx="200" cy="376" r="17" fill="none" stroke="url(#energy)" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="200" cy="376" r="8.5" fill="none" stroke="#0a0e14" stroke-width="2"/>
    <path d="M188 366 A17 17 0 0 1 212 366" stroke="#9fb4cc" stroke-width="1" opacity="0.6" fill="none"/>
