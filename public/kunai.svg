    <path d="M312 296 l-20 -2 12 -8 -18 -8" fill="none" stroke-width="2" opacity="0.8"/>
  </g>
  <g stroke="#a855f7" stroke-linecap="round" filter="url(#glow)">
    <path d="M330 176 l16 -6 -12 12" fill="none" stroke-width="2" opacity="0.8"/>
    <path d="M62 214 l-14 8 14 4" fill="none" stroke-width="2" opacity="0.75"/>
  </g>

  <g>
    <circle cx="136" cy="64" r="2" fill="#67e8f9" opacity="0.9"/>
    <circle cx="272" cy="112" r="1.6" fill="#818cf8" opacity="0.8"/>
    <circle cx="118" cy="336" r="1.6" fill="#22d3ee" opacity="0.7"/>
    <circle cx="290" cy="356" r="2" fill="#67e8f9" opacity="0.8"/>
    <circle cx="334" cy="136" r="1.4" fill="#a855f7" opacity="0.7"/>
